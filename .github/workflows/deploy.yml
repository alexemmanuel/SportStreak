name: Deploy SportStreak

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:   # allows manual runs

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]   # change if you need 18 or 22

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'          # or 'yarn' / 'pnpm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f yarn.lock ]; then
            yarn install --frozen-lockfile
          elif [ -f pnpm-lock.yaml ]; then
            npm install -g pnpm && pnpm install --frozen-lockfile
          else
            npm install
          fi

      - name: Run tests (optional)
        run: npm test --if-present

      - name: Build project
        run: npm run build --if-present
        env:
          # Add any build-time env vars you need
          NODE_ENV: production

      # ---------- Choose ONE deployment method below ----------

      # Option A: Deploy to GitHub Pages (static sites)
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist          # change to your build output folder (build, out, public, etc.)

      # Option B: Deploy to Vercel (uncomment and add secrets)
      # - name: Deploy to Vercel
      #   if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
